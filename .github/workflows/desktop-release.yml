name: Desktop Release

on:
  push:
    tags:
      - 'dsh-*-community.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the release to attach installers to (e.g. dsh-v0.2.1-alpha.4-community.1)'
        required: false
        default: ''
      target:
        description: 'Platform targets to build'
        type: choice
        options: [all, windows, macos]
        default: all
        required: true

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-windows:
    name: Package Windows (x64)
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'windows'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows desktop package (unsigned)
        run: pnpm run package:desktop:win:x64:unsigned

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-desktop-${{ github.run_id }}
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Attach Windows installer to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          $tag = $env:TAG_INPUT
          if (-not $tag) { $tag = $env:GITHUB_REF_NAME }
          if ($tag -match '^dsh-.*-community\.') {
            Write-Host "Uploading Windows installer to release: $tag"
            $files = Get-ChildItem -Path "apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe"
            foreach ($f in $files) {
              gh release upload $tag $f.FullName --clobber
            }
          } else {
            Write-Host "Skipping release asset upload: ref is not a community release tag ($tag)"
          }

  package-macos:
    name: Package macOS (Apple Silicon ARM64)
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'macos'
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS desktop package (unsigned)
        run: pnpm run package:desktop:mac:arm64:unsigned

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-desktop-${{ github.run_id }}
          path: apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Attach macOS installer to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          TAG="${TAG_INPUT}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          if [[ "$TAG" =~ ^dsh-.*-community\. ]]; then
            echo "Uploading macOS installers to release: $TAG"
            for f in apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/*.dmg apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/*.zip; do
              if [ -f "$f" ]; then
                gh release upload "$TAG" "$f" --clobber
              fi
            done
          else
            echo "Skipping release asset upload: ref is not a community release tag ($TAG)"
          fi
