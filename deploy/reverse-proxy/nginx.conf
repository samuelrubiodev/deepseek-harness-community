# ==============================================================================
# DeepSeek Harness - Configuración de Referencia Nginx para Producción
# ==============================================================================
# Soporta:
# 1. Terminación TLS / SSL con HTTP/2.
# 2. Conexiones persistentes de WebSockets (/api/remote.mux).
# 3. Streaming de tokens LLM en tiempo real (proxy_buffering off).
# 4. Cargas de archivos de hasta 300MB (imágenes y adjuntos multimedia).
# 5. Preservación estricta de X-Forwarded-Host y X-Forwarded-Proto.
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    # Mapeo para actualización dinámica de cabeceras WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Redirección global de HTTP a HTTPS
    server {
        listen 80;
        server_name harness.midominio.com; # Modificar por tu dominio o FQDN

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Servidor seguro HTTPS con terminación TLS
    server {
        listen 443 ssl http2;
        server_name harness.midominio.com; # Modificar por tu dominio o FQDN

        # Certificados SSL (Let's Encrypt o Certificado propio)
        ssl_certificate /etc/ssl/certs/dsh.crt;
        ssl_certificate_key /etc/ssl/private/dsh.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Límite de carga alineado con el carrier de imágenes de DSH (300 MiB)
        client_max_body_size 300M;

        location / {
            # Dirección del contenedor o servicio DeepSeek Harness
            proxy_pass http://harness:3080;
            proxy_http_version 1.1;

            # Cabeceras de Autoridad y Host
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Soporte de WebSockets
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Desactivar buffer para streaming de tokens en tiempo real
            proxy_buffering off;
            proxy_cache off;

            # Timeouts prolongados para razonamiento complejo de agentes
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
