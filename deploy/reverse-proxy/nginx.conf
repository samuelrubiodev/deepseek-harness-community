# ==============================================================================
# DeepSeek Harness - Production Reference Nginx Configuration
# ==============================================================================
# Features:
# 1. TLS/SSL termination with HTTP/2 support.
# 2. Persistent WebSocket upgrades (/api/remote.mux).
# 3. Real-time LLM token streaming (proxy_buffering off).
# 4. Large attachment uploads up to 300MB.
# 5. Correct preservation of X-Forwarded-Host and X-Forwarded-Proto.
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    # Dynamic WebSocket upgrade header mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Global HTTP to HTTPS redirection
    server {
        listen 80;
        server_name harness.example.com; # Replace with your domain or FQDN

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Secure HTTPS server with TLS termination
    server {
        listen 443 ssl http2;
        server_name harness.example.com; # Replace with your domain or FQDN

        # SSL Certificates (Let's Encrypt or custom certificates)
        ssl_certificate /etc/ssl/certs/dsh.crt;
        ssl_certificate_key /etc/ssl/private/dsh.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Upload limit matching DeepSeek Harness payload limits (300 MiB)
        client_max_body_size 300M;

        location / {
            # DeepSeek Harness upstream service
            proxy_pass http://harness:3080;
            proxy_http_version 1.1;

            # Authority and forwarding headers
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Disable buffering for instant LLM token delivery
            proxy_buffering off;
            proxy_cache off;

            # Generous timeouts for deep agent reasoning steps
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
