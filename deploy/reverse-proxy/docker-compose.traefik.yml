# ==============================================================================
# DeepSeek Harness - Production Reference Traefik v3 Compose Configuration
# ==============================================================================
# Features:
# 1. Native container discovery via Docker service labels.
# 2. Automated SSL/TLS certificates through Let's Encrypt ACME.
# 3. Transparent WebSocket and HTTP/2 multiplexing.
# ==============================================================================

services:
  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Automatic HTTP -> HTTPS redirection
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      # Let's Encrypt configuration
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=admin@example.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik-certificates:/letsencrypt"
    networks:
      - dsh-network

  harness:
    image: deepseek-harness:latest
    container_name: deepseek-harness
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DSH_HOME=/data
      - WORKSPACE_DIR=/workspace
      - DSH_HOST=0.0.0.0
      - DSH_PORT=3080
      - DSH_TRUSTED_HOSTS=harness.example.com
      - DSH_REVERSE_PROXY=true
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    volumes:
      - dsh-data:/data
      - dsh-workspace:/workspace
    networks:
      - dsh-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dsh.rule=Host(`harness.example.com`)"
      - "traefik.http.routers.dsh.entrypoints=websecure"
      - "traefik.http.routers.dsh.tls.certresolver=myresolver"
      - "traefik.http.services.dsh.loadbalancer.server.port=3080"
      # Preserve headers and protocol
      - "traefik.http.middlewares.dsh-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.dsh.middlewares=dsh-headers"

volumes:
  traefik-certificates:
  dsh-data:
  dsh-workspace:

networks:
  dsh-network:
    driver: bridge
