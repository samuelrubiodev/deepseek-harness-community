# ==============================================================================
# DeepSeek Harness - Configuración de Referencia Traefik v3 para Producción
# ==============================================================================
# Proporciona:
# 1. Reverse Proxy nativo para contenedores Docker mediante labels.
# 2. Emisión automática de certificados SSL con Let's Encrypt (HTTP challenge / ACME).
# 3. Soporte automático de WebSockets y Streaming HTTP/2.
# ==============================================================================

services:
  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Redirección automática HTTP -> HTTPS
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      # Configuración de Let's Encrypt
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=admin@midominio.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik-certificates:/letsencrypt"
    networks:
      - dsh-network

  harness:
    image: deepseek-harness:latest
    container_name: deepseek-harness
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DSH_HOME=/data
      - WORKSPACE_DIR=/workspace
      - DSH_HOST=0.0.0.0
      - DSH_PORT=3080
      - DSH_TRUSTED_HOSTS=harness.midominio.com
      - DSH_REVERSE_PROXY=true
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    volumes:
      - dsh-data:/data
      - dsh-workspace:/workspace
    networks:
      - dsh-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dsh.rule=Host(`harness.midominio.com`)"
      - "traefik.http.routers.dsh.entrypoints=websecure"
      - "traefik.http.routers.dsh.tls.certresolver=myresolver"
      - "traefik.http.services.dsh.loadbalancer.server.port=3080"
      # Preservar cabeceras y desactivar buffers
      - "traefik.http.middlewares.dsh-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.dsh.middlewares=dsh-headers"

volumes:
  traefik-certificates:
  dsh-data:
  dsh-workspace:

networks:
  dsh-network:
    driver: bridge
