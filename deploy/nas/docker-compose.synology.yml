# ==============================================================================
# DeepSeek Harness — Synology DSM (Container Tools / Container Manager)
# ==============================================================================
# Usage on DSM 7.2+ (Container Tools > Project > Add):
#   1. Choose project name "deepseek-harness" and path /volume1/docker/dsh.
#   2. Paste this file (Path: ./docker-compose.yml) or upload it there.
#   3. Edit DSH_TRUSTED_HOSTS to your LAN IP or domain BEFORE first start.
#   4. First start pulls the public image from GHCR:
#        sudo docker pull ghcr.io/samuelrubiodev/deepseek-harness:latest
#      (or Container Tools > Registry > add it manually). No login needed for
#      this public image; the compose `up` fetches it on its own.
#
# Bind mounts (not named volumes) keep /data visible in File Station, so the
# Synology Hyper Backup / snapshots tooling can archive it directly; use
# deploy/operations/backup-data.sh for app-consistent tarballs.
# The container runs securely as non-root (user 'node', UID:GID 1000:1000).
# Ensure host directories are owned or writable by UID 1000.
# ==============================================================================

services:
  harness:
    image: ghcr.io/samuelrubiodev/deepseek-harness:latest
    container_name: deepseek-harness
    restart: unless-stopped
    # Runs securely as unprivileged 'node' user (UID:GID 1000:1000) by default.
    ports:
      - "3080:3080"
    environment:
      NODE_ENV: production
      DSH_HOST: 0.0.0.0
      DSH_PORT: 3080
      # REQUIRED for LAN access: every address users type in the browser,
      # comma-separated. Requests from any other Host header get HTTP 403.
      DSH_TRUSTED_HOSTS: "192.168.1.50:3080,harness.lan"
      # Set true only behind a reverse proxy that forwards X-Forwarded-*:
      DSH_REVERSE_PROXY: "false"
      DSH_HOME: /data
      WORKSPACE_DIR: /workspace
      # token (default): sign-in via /?token=... + 30-day cookie.
      # none: no token/cookie at all — ONLY the DSH_TRUSTED_HOSTS fence protects
      # the app; never combine with 0.0.0.0 on untrusted networks.
      DSH_AUTH_MODE: "token"
      # Fixed sign-in token; set to a long random secret (openssl rand -base64 32
      # | tr "+/" "-_") to make the URL stable across restarts. Empty = random.
      DSH_AUTH_TOKEN: ""
      # Optional: leave empty to enter the key in the Web UI instead.
      DEEPSEEK_API_KEY: ""
      DEEPSEEK_BASE_URL: ""
    volumes:
      - /volume1/docker/dsh/data:/data
      - /volume1/docker/dsh/workspace:/workspace
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
