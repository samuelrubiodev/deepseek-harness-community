events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Servidor 1: Puerto 8080 - HTTP estándar con WebSockets y cabeceras de proxy
    server {
        listen 8080;
        server_name _;

        location / {
            proxy_pass http://harness:3080;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Soporte de WebSockets y Streaming
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Timeouts prolongados para streaming de agentes LLM
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    # Servidor 2: Puerto 8443 - HTTPS con terminación TLS y WebSockets
    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://harness:3080;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Soporte de WebSockets y Streaming
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Timeouts prolongados para streaming de agentes LLM
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    # Servidor 3: Puerto 8081 - Proxy con reescritura de Host (simulación de proxies mal configurados)
    server {
        listen 8081;
        server_name _;

        location / {
            proxy_pass http://harness:3080;
            proxy_http_version 1.1;
            proxy_set_header Host harness:3080;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
