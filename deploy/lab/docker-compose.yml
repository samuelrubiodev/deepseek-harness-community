services:
  harness:
    build:
      context: ../..
      dockerfile: deploy/lab/Dockerfile
      network: host
    container_name: dsh-lab-harness
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "3080:3080"
    command: ["web", "--patch", "/bind-all.patch.yml", "--no-open", "--port", "3080"]
    environment:
      - NODE_ENV=production
      - DSH_HOME=/data
    volumes:
      - dsh-lab-data:/data
      - ./bind-all.patch.yml:/bind-all.patch.yml:ro

  proxy:
    image: nginx:alpine
    container_name: dsh-lab-proxy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - harness

volumes:
  dsh-lab-data:
