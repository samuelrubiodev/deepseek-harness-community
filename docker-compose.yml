services:
  harness:
    build:
      context: .
      dockerfile: docker/Dockerfile
      network: host
    image: deepseek-harness:latest
    container_name: deepseek-harness
    restart: unless-stopped
    ports:
      - "${DSH_PORT:-3080}:${DSH_PORT:-3080}"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - DSH_HOME=/data
      - WORKSPACE_DIR=/workspace
      - DSH_HOST=${DSH_HOST:-0.0.0.0}
      - DSH_PORT=${DSH_PORT:-3080}
      - DSH_TRUSTED_HOSTS=${DSH_TRUSTED_HOSTS:-}
      - DSH_REVERSE_PROXY=${DSH_REVERSE_PROXY:-false}
      - DSH_AUTH_MODE=${DSH_AUTH_MODE:-token}
      - DSH_AUTH_TOKEN=${DSH_AUTH_TOKEN:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-}
    volumes:
      - dsh-data:/data
      - dsh-workspace:/workspace
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dsh-data:
  dsh-workspace:
